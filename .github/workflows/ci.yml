name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · PHP 8.5 · quality gates
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:18.2-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: golden_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d golden_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Doctrine appends '_test' to the database name in the test environment
      DATABASE_URL: postgresql://root:password@127.0.0.1:5432/golden_gate?serverVersion=18&charset=utf8
      # Provider credentials are deliberately empty: the suite mocks every provider
      # call, so CI never reaches a real LLM API.
      OVHCLOUD_BASE_URL: https://oai.endpoints.kepler.ai.cloud.ovh.net
      OVHCLOUD_API_KEY: ''
      MISTRAL_BASE_URL: https://api.mistral.ai
      MISTRAL_API_KEY: ''
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, intl, mbstring, pdo_pgsql, pgsql, sodium, zip
          coverage: none

      - name: Cache Composer dependencies
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Keys are gitignored; generate them with the configured dev passphrase (.env)
      - name: Generate JWT keys
        run: php bin/console lexik:jwt:generate-keypair --overwrite --no-interaction

      - name: Code style (PHPCS)
        run: vendor/bin/phpcs

      - name: Static analysis (PHPStan)
        run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress

      - name: Tests (PHPUnit)
        run: php bin/phpunit

  frontend:
    name: Frontend · Node 24 · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type-check + build (Vite)
        run: npm run build

  docker:
    name: Docker · FrankenPHP image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build FrankenPHP image
        run: docker compose build php

      - name: Validate Caddyfile
        run: >-
          docker compose run --rm --no-deps php frankenphp validate
          --config /etc/frankenphp/Caddyfile